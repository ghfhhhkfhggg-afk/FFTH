name: Build IPA from zip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract source zip
        id: extract
        run: |
          set -euo pipefail
          ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -name '*.zip' -type f -print -quit)
          [ -n "$ZIP" ] || { echo 'No .zip found in repository.' >&2; exit 1; }
          echo "Found zip: $ZIP"
          EXTRACT_DIR="$RUNNER_TEMP/source"
          mkdir -p "$EXTRACT_DIR"
          unzip -o "$ZIP" -d "$EXTRACT_DIR"
          
          # หาโปรเจกต์ — ข้ามโฟลเดอร์ __MACOSX
          PROJECT=$(find "$EXTRACT_DIR" -name '*.xcodeproj' -type d -not -path '*/__MACOSX/*' -print -quit)
          [ -n "$PROJECT" ] || { echo 'No .xcodeproj found inside zip.' >&2; exit 1; }
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT"
          
          # แสดงรายการ Scheme ทั้งหมดในโปรเจกต์
          echo "Available schemes:"
          xcodebuild -list -project "$PROJECT" 2>/dev/null | grep -A 100 "Schemes:" | grep -v "Schemes:" | sed '/^$/q' | sed 's/^ *//'

      - name: Auto-detect scheme & build
        run: |
          set -euo pipefail
          PROJECT="${{ steps.extract.outputs.project }}"
          # ดึงชื่อ Scheme แรกจากในโปรเจกต์
          SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | awk '/Schemes:/{getline; print; exit}' | sed 's/^ *//')
          [ -n "$SCHEME" ] || { echo 'No scheme found!' >&2; exit 1; }
          echo "Using scheme: $SCHEME"
          
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PRODUCT_BUNDLE_IDENTIFIER=com.apple.mobile.MobileHouseArrest \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          [ -n "$APP_PATH" ] || { echo 'No .app produced.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" "$RUNNER_TEMP/OGIOS.ipa"
          test -s "$RUNNER_TEMP/OGIOS.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OGIOS-unsigned-ipa
          path: ${{ runner.temp }}/OGIOS.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
